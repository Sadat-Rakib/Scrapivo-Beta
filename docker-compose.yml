# Docker Compose configuration for FreeHire Job Integration
# This file sets up PostgreSQL and Meilisearch containers for the job aggregation system
# Windows-compatible configuration with persistent volumes

version: '3.8'

services:
  # PostgreSQL - Source of truth for all job data
  postgres:
    image: postgres:16-alpine
    container_name: freehire-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: freehire
      POSTGRES_USER: freehire_user
      POSTGRES_PASSWORD: freehire_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Persistent volume for PostgreSQL data (Windows-compatible path)
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freehire_user -d freehire"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - freehire-network

  # Meilisearch - Fast search index for job queries
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: freehire-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: freehire_master_key_change_in_production
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: true
      MEILI_DB_PATH: /meili_data
    volumes:
      # Persistent volume for Meilisearch index data (Windows-compatible path)
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - freehire-network

# Named volumes for data persistence
# These are managed by Docker and work consistently across Windows, Linux, and macOS
volumes:
  postgres_data:
    driver: local
  meilisearch_data:
    driver: local

# Network for service communication
networks:
  freehire-network:
    driver: bridge
